name: ci

on:
  push:
    branches: [dev, "chore/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      substrate_ref:
        description: "fkst-substrate ref to build fkst-framework from"
        default: ""
        required: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout marketing packages
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve fkst-substrate ref
        id: substrate_ref
        shell: bash
        run: |
          set -euo pipefail
          ref="${{ github.event.inputs.substrate_ref }}"
          if [ -z "$ref" ]; then
            ref="$(sed -n '1{s/[[:space:]]//g;p;q}' .fkst/substrate-ref 2>/dev/null || true)"
          fi
          if [ -z "$ref" ]; then
            ref="dev"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "fkst-substrate ref: $ref"

      - name: Checkout fkst-substrate
        uses: actions/checkout@v4
        with:
          repository: ChronoAIProject/fkst-substrate
          ref: ${{ steps.substrate_ref.outputs.ref }}
          path: fkst-substrate

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fkst-substrate

      - name: Build fkst-framework
        working-directory: fkst-substrate
        run: cargo build -p fkst-framework

      - name: Run marketing package tests
        env:
          BIN: ${{ github.workspace }}/fkst-substrate/target/debug/fkst-framework
        run: |
          test -x "$BIN"
          scripts/run.sh check
          scripts/run.sh test
          scripts/run.sh test-composed
